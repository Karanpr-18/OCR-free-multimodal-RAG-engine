[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-doc-rag"
version = "0.1.0"
description = "OCR-Free Multimodal Document & Diagram RAG Engine"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Karanpr-18"},
]
keywords = ["rag", "multimodal", "ocr-free", "document-ai", "colqwen"]

[project.dependencies]
dependencies = [
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "transformers>=4.49.0",
    "colpali-engine>=0.3.8",
    "qdrant-client>=1.13.0",
    "qwen-vl-utils>=0.0.10",
    "accelerate>=1.3.0",
    "sentence-transformers>=3.4.0",
    "datasets>=3.2.0",
    "pymupdf>=1.25.0",
    "pillow>=11.0.0",
    "numpy>=1.26.0",
    "scipy>=1.14.0",
    "scikit-learn>=1.6.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.20",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pyyaml>=6.0.2",
    "matplotlib>=3.10.0",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "httpx>=0.28.0"]

[project.scripts]
multimodal-rag-serve = "src.api.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
