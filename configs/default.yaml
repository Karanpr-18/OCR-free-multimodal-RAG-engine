# Default configuration for OCR-Free Multimodal RAG Engine

model:
  vlm_model: "Qwen/Qwen2.5-VL-3B-Instruct"
  colqwen_model: "vidore/colqwen2.5-v0.2"
  device: "auto"
  dtype: "bfloat16"
  max_new_tokens: 1024

retrieval:
  top_k: 2
  collection_name: "multimodal_docs"
  embedding_dim: 128
  similarity: "maxsim"
  binary_quantization: true
  rescore: true

qdrant:
  mode: "local"  # "local" for embedded, "remote" for server
  url: "http://localhost:6333"
  local_path: "./qdrant_storage"

ingestion:
  dpi: 150
  batch_size: 4

generation:
  temperature: 0.1
  max_new_tokens: 1024
  system_prompt: >
    You are a precise document analyst. Answer the user's question based only
    on the provided document pages. If the information is not clearly present,
    say so.

abstention:
  confidence_threshold: 0.5
  calibration_method: "logistic"
