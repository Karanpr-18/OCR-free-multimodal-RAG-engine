# Default configuration for OCR-Free Multimodal RAG Engine

model:
  vlm_model: "Qwen/Qwen2.5-VL-3B-Instruct"
  vlm_api_endpoint: null
  vlm_api_key: null
  colqwen_model: "vidore/colqwen2.5-v0.2"
  device: "auto"
  dtype: "bfloat16"
  max_new_tokens: 1024

# Supported real vision-language models for local weights or API providers
supported_vlm_models:
  - id: "Qwen/Qwen2.5-VL-3B-Instruct"
    name: "Qwen2.5-VL 3B Instruct (Default Fast Local VLM)"
    type: "local_or_vllm"
    provider: "huggingface"
  - id: "Qwen/Qwen2.5-VL-7B-Instruct"
    name: "Qwen2.5-VL 7B Instruct (High-Accuracy Local VLM)"
    type: "local_or_vllm"
    provider: "huggingface"
  - id: "meta-llama/Llama-3.2-11B-Vision-Instruct"
    name: "Llama-3.2 11B Vision Instruct (Open Weight VLM)"
    type: "local_or_vllm"
    provider: "huggingface"
  - id: "openai/gpt-4o-mini"
    name: "OpenAI GPT-4o-mini (Cloud Multimodal API)"
    type: "api"
    provider: "openai"
  - id: "google/gemini-1.5-flash"
    name: "Google Gemini 1.5 Flash (Cloud Multimodal API)"
    type: "api"
    provider: "google"
  - id: "google/gemini-2.0-flash"
    name: "Google Gemini 2.0 Flash (Next-Gen Multimodal API)"
    type: "api"
    provider: "google"

retrieval:
  top_k: 2
  collection_name: "multimodal_docs"
  embedding_dim: 128
  similarity: "maxsim"
  binary_quantization: true
  rescore: true

qdrant:
  mode: "local"  # "local" for embedded, "remote" for server
  url: "http://localhost:6333"
  local_path: "./qdrant_storage"

ingestion:
  dpi: 150
  batch_size: 4

generation:
  temperature: 0.1
  max_new_tokens: 1024
  system_prompt: >
    You are a precise document analyst. Answer the user's question based only
    on the provided document pages. If the information is not clearly present,
    say so.

abstention:
  confidence_threshold: 0.5
  calibration_method: "logistic"
