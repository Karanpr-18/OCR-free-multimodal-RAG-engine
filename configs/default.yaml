# Default configuration for OCR-Free Multimodal RAG Engine

model:
  vlm_model: "opencode/deepseek-v4.1-flash-free"
  vlm_api_endpoint: null
  vlm_api_key: null
  colqwen_model: "vidore/colqwen2.5-v0.2"
  device: "auto"
  dtype: "bfloat16"
  max_new_tokens: 1024

# Top models available in this engine
supported_vlm_models:
  - id: "opencode/deepseek-v4.1-flash-free"
    name: "DeepSeek v4.1 Flash (Free Tier / OpenCode)"
    type: "api"
    free_tier: true
  - id: "opencode/glm-5.3-flash-free"
    name: "GLM-5.3 Flash (Free Tier / OpenCode)"
    type: "api"
    free_tier: true
  - id: "Qwen/Qwen2.5-VL-7B-Instruct"
    name: "Qwen2.5-VL 7B Instruct"
    type: "local_or_vllm"
    free_tier: true
  - id: "meta-llama/Llama-3.2-11B-Vision-Instruct"
    name: "Llama-3.2 11B Vision Instruct"
    type: "local_or_vllm"
    free_tier: true
  - id: "google/paligemma2-10b-pt-448"
    name: "PaliGemma-2 10B"
    type: "local_or_vllm"
    free_tier: true

retrieval:
  top_k: 2
  collection_name: "multimodal_docs"
  embedding_dim: 128
  similarity: "maxsim"
  binary_quantization: true
  rescore: true

qdrant:
  mode: "local"  # "local" for embedded, "remote" for server
  url: "http://localhost:6333"
  local_path: "./qdrant_storage"

ingestion:
  dpi: 150
  batch_size: 4

generation:
  temperature: 0.1
  max_new_tokens: 1024
  system_prompt: >
    You are a precise document analyst. Answer the user's question based only
    on the provided document pages. If the information is not clearly present,
    say so.

abstention:
  confidence_threshold: 0.5
  calibration_method: "logistic"
