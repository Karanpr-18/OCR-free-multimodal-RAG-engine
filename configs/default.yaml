# Default configuration for OCR-Free Multimodal RAG Engine (API-First Mode)

model:
  vlm_model: "opencode/deepseek-v4.1-flash-free"
  vlm_api_endpoint: "http://localhost:18787/v1"
  vlm_api_key: null
  colqwen_model: "vidore/colqwen2.5-v0.2"
  device: "cpu"
  dtype: "float32"
  max_new_tokens: 1024

# Supported vision-language models (API-first via OpenCode or Google Gemini)
supported_vlm_models:
  - id: "opencode/deepseek-v4.1-flash-free"
    name: "DeepSeek v4.1 Flash (OpenCode Free Tier)"
    type: "opencode_bridge"
    provider: "opencode"
    free: true
  - id: "opencode/glm-5.3-flash-free"
    name: "GLM-5.3 Flash (OpenCode Free Tier)"
    type: "opencode_bridge"
    provider: "opencode"
    free: true
  - id: "opencode/qwen-2.5-vl-72b-free"
    name: "Qwen 2.5 VL 72B (OpenCode Free Tier)"
    type: "opencode_bridge"
    provider: "opencode"
    free: true
  - id: "google/gemini-2.0-flash"
    name: "Google Gemini 2.0 Flash (Recommended Cloud)"
    type: "gemini_api"
    provider: "google"
    free: true
  - id: "google/gemini-1.5-flash"
    name: "Google Gemini 1.5 Flash"
    type: "gemini_api"
    provider: "google"
    free: true
  - id: "openai/gpt-4o-mini"
    name: "OpenAI GPT-4o-mini"
    type: "openai_api"
    provider: "openai"
    free: false

retrieval:
  top_k: 2
  collection_name: "multimodal_docs"
  embedding_dim: 128
  similarity: "maxsim"
  binary_quantization: true
  rescore: true

qdrant:
  mode: "local"  # "local" for embedded, "remote" for server
  url: "http://localhost:6333"
  local_path: "./qdrant_storage"

ingestion:
  dpi: 150
  batch_size: 4

generation:
  temperature: 0.1
  max_new_tokens: 1024
  system_prompt: >
    You are a precise document analyst. Answer the user's question based only
    on the provided document pages. If the information is not clearly present,
    say so.

abstention:
  confidence_threshold: 0.5
  calibration_method: "logistic"
